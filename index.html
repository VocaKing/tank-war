<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Steel Front – 3D Tank War</title>
<script>
(function(){var p=new URLSearchParams(location.search).get('mobile');if(p==='1'||(p!=='0'&&(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>0&&Math.min(screen.width,screen.height,innerWidth,innerHeight)<=1024)||Math.min(innerWidth,innerHeight)<=600)))document.documentElement.classList.add('mobile-device');})();
</script>

  <link rel="modulepreload" crossorigin href="/tank-war/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/tank-war/assets/game-y0aQBdnk.css">
<style>/* Always-visible deploy action.  Outside normal scrolling flow, above content, below dialogs. */
.mobile-deploy{display:none}
html.mobile-device .menu{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))!important}
html.mobile-device .menu>.mobile-deploy{display:block!important;position:fixed!important;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto!important;z-index:65;min-height:54px;padding:12px;border:1px solid #efcb73;border-radius:10px;background:linear-gradient(#f6d77b,#bf8a2a);box-shadow:0 3px 18px #000a;color:#18130b;font-size:20px;font-weight:800;pointer-events:auto;touch-action:manipulation}
html.mobile-device .menu:has(.overlay[style*="display: flex"])>.mobile-deploy{visibility:hidden}
html.mobile-device .menu #m-maps{align-items:center;justify-content:center}
html.mobile-device .menu #m-maps .mapbox{display:flex;flex-direction:column;width:min(100%,700px);max-height:calc(100dvh - 24px);overflow:hidden;min-height:0}
html.mobile-device .menu #m-maps .mapgrid{overflow:auto;min-height:0;flex:1}
html.mobile-device .menu #m-maps .mapacts{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;flex-shrink:0;padding-top:8px;background:#15191d}
html.mobile-device .menu #m-maps .mapacts button{flex:1;min-height:44px;white-space:normal}
html.mobile-device .menu #m-maps #m-map-go{background:#e6bb53;color:#151009;font-weight:800}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<script>
(function(){
 const ui=document.getElementById('ui');
 function install(){
  if(!document.documentElement.classList.contains('mobile-device'))return;
  const menu=ui.querySelector('.menu'),original=menu?.querySelector('#m-battle');
  if(!original||menu.querySelector('#m-mobile-deploy'))return;
  const b=document.createElement('button');b.id='m-mobile-deploy';b.className='mobile-deploy';b.textContent='进入战斗 · BATTLE';b.onclick=()=>{original.click();const go=menu.querySelector('#m-map-go');if(go)go.textContent='确认出战 / Deploy';};menu.append(b);
 }
 new MutationObserver(install).observe(ui,{childList:true,subtree:true});install();
})();
</script>
</body>
</html>
