name: IS-2 Blender asset build

on:
  push:
    branches:
      - blender/is2-model1944-level2
    paths:
      - "tools/blender/**"
      - ".github/workflows/is2-blender-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/blender/**"
      - ".github/workflows/is2-blender-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-is2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Validate Python script syntax
        run: python3 -m py_compile tools/blender/is2_model1944_blockout.py

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version

      - name: Generate IS-2 GLB and review renders
        run: |
          mkdir -p public/models artifacts
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python tools/blender/is2_model1944_blockout.py

      - name: Verify exported asset
        run: |
          test -s public/models/is2_model1944_blockout.glb
          test -s artifacts/is2-model1944/is2_model1944_first_pass.blend
          test -s artifacts/is2-model1944/01_front_three_quarter.png
          test -s artifacts/is2-model1944/02_left_side.png
          test -s artifacts/is2-model1944/03_front.png
          test -s artifacts/is2-model1944/04_rear.png
          test -s artifacts/is2-model1944/05_top.png
          ls -lh public/models/is2_model1944_blockout.glb artifacts/is2-model1944/

      - name: Upload model and visual review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is2-model1944-blender-first-pass
          if-no-files-found: warn
          path: |
            public/models/is2_model1944_blockout.glb
            artifacts/is2-model1944/is2_model1944_first_pass.blend
            artifacts/is2-model1944/*.png
