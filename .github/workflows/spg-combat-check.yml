name: SPG combat system checks

on:
  push:
    branches:
      - feature/spg-combat-system
  pull_request:
    branches:
      - main

jobs:
  build-and-spg-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Verify artillery deployment, firing, recoil and reload
        run: node tools_spg.mjs http://127.0.0.1:5173/
      - name: Verify live balance dispersion and river mobility
        run: node tools_dispersion_mobility.mjs http://127.0.0.1:5173/
